{% block latest_added_games %}
    {% if latest_games %}
        <section class="latest-games py-5">
            <div class="container">
                <h2 class="text-center mb-4">Последние добавленные игры</h2>
                <div class="row g-4">
                {% for game in latest_games %}
                    <div class="col-6 col-md-4 col-lg-2">
                        <a href="{{ url_for('game.profile', game_id=game.id) }}" class="text-decoration-none">
                            <div class="card game-card h-100 border-0 shadow-sm">
                                <img src="{{ game.cover_uri }}" class="card-img-top" alt="{{ game.title }}" loading="lazy">
                                <div class="card-body text-center">
                                    <h6 class="card-title text-dark mb-1">{{ game.title }}</h6>
                                    <div class="d-flex justify-content-center align-items-center">
                                        <span class="text-muted small">{{ game.average_rating }}</span>
                                        <span class="text-muted small ms-2">({{ game.review_count }})</span>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>
                {% endfor %}
                </div>
            </div>
        </section>
    {%else%}
        <h2>Пока ничего нет!</h2>
    {% endif %}
{% endblock %}
